name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Syntax + encoding checks
        run: |
          python -m compileall -q .       # fails on syntax errors anywhere
          python _check_ascii.py          # exits non-zero on non-ASCII/BOM files

      - name: List discovered projects
        run: python run_all.py --list

      - name: Smoke-run all 16 projects (--smoke for p5-p14, GENAI_ITERS=100 for p15-p20)
        run: python run_all.py --smoke --timeout 600

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-results
          path: run_results.json
          if-no-files-found: ignore
